<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>낑꿍깡꿍 캘린더</title>
<!-- v: multi-day events + lucky draw merged on live 1791448328-f031 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ff;--bg2:#fff9ee;--card:#fff;--text:#4a4458;--sub:#9a93ab;--me:#9b8ae0;--you:#f3a6c2;--line:#ece6f5;--sh:rgba(120,100,180,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1b2b;--bg2:#241f33;--card:#2b2639;--text:#efeaf8;--sub:#a79fbd;--line:#3b3452;--sh:rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#1f1b2b;--bg2:#241f33;--card:#2b2639;--text:#efeaf8;--sub:#a79fbd;--line:#3b3452;--sh:rgba(0,0,0,.25)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed;color:var(--text);font-family:"Gowun Dodum",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;margin-top:4px;flex-wrap:wrap;gap:6px}
.hb{display:flex;gap:6px}
.hb .dbtn{padding:0 10px;font-size:12px}
h1{font-size:20px;margin:0}
.dbtn.on{background:var(--me);color:#fff}
.dbtn{height:32px;padding:0 12px;font-size:13px;background:var(--card);color:var(--me);border:1px solid var(--me);border-radius:99px}
.sub{color:var(--sub);font-size:13px;margin:4px 0 14px}
.main-tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.main-tabs button{flex:1;background:none;color:var(--sub);height:40px;font-weight:600}
.main-tabs button.on{background:var(--me);color:#fff}
.add{display:flex;gap:8px;margin-bottom:12px}
input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:16px}
button{border:0;border-radius:12px;padding:0 16px;background:var(--me);color:#fff;font-size:15px;cursor:pointer}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{background:var(--card);color:var(--sub);padding:8px 14px;border:1px solid var(--line);font-size:13px}
.tabs button.on{background:var(--text);color:var(--bg)}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.item input[type=checkbox]{flex:none;width:22px;height:22px;accent-color:var(--me)}
.t{flex:1;word-break:break-all}
.done .t{text-decoration:line-through;color:var(--sub)}
.who{font-size:11px;padding:2px 8px;border-radius:99px;color:#fff;flex:none}
.del{background:none;color:var(--sub);padding:0 4px;font-size:18px}
.empty{text-align:center;color:var(--sub);padding:24px 0;font-size:14px}
.hide{display:none!important}
.pw-overlay{position:fixed;inset:0;background:rgba(35,27,48,.58);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.pw-card{width:100%;max-width:340px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.pw-card h2{font-size:19px;margin:0 0 8px;text-align:center}
.pw-card p{font-size:13px;color:var(--sub);text-align:center;margin:0 0 16px}
.pw-card input{width:100%;box-sizing:border-box;margin-bottom:8px}
.pw-actions{display:flex;gap:8px;margin-top:10px}
.pw-actions button{flex:1;height:42px}
#pwError{min-height:18px;color:#d85b78;font-size:12px;text-align:center}
select{flex:none;padding:12px 6px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:14px;max-width:122px}
.tabs.sm{gap:2px;margin-bottom:4px}
.tabs.sm button{background:none;border:0;border-radius:8px;padding:4px 10px;font-size:12px;color:var(--sub)}
.tabs.sm button.on{background:none;color:var(--me);font-weight:700}
.grip{flex:none;color:var(--sub);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:18px;line-height:1;padding:6px 2px}
.grp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px;padding:8px 2px 4px}
.note{position:relative;min-height:104px;display:flex;flex-direction:column;padding:10px 10px 8px;border-radius:3px 3px 16px 3px;background:var(--nc);color:#4a3b2a;box-shadow:2px 4px 8px rgba(80,50,40,.16);transform:rotate(var(--rot));font-size:14px;user-select:none;-webkit-user-select:none}
.note::before{content:'';position:absolute;top:-7px;left:50%;width:40px;height:13px;margin-left:-20px;background:rgba(255,255,255,.6);box-shadow:0 1px 2px rgba(0,0,0,.12);transform:rotate(-3deg)}
.note.c0{--nc:#fdf0b8}.note.c1{--nc:#fbdbe7}.note.c2{--nc:#e5dcfb}.note.c3{--nc:#ffe9c9}.note.c4{--nc:#f1e4fa}
.note .nt{display:flex;align-items:center;justify-content:space-between}
.note input[type=checkbox]{flex:none;width:20px;height:20px;padding:0;accent-color:#9b8ae0}
.note .grip{font-size:20px;padding:4px 6px;color:rgba(74,59,42,.45)}
.note .ntx{flex:1;margin:8px 0 6px;word-break:break-all;line-height:1.4}
.note .nb{display:flex;align-items:center;justify-content:space-between}
.note .who{font-size:10px;padding:1px 7px}
.note .del{color:rgba(74,59,42,.5);font-size:17px}
.note.done{opacity:.6}
.note.drag{transform:scale(1.06) rotate(0)!important;box-shadow:4px 10px 18px rgba(80,50,40,.3);position:relative;z-index:5;opacity:.97}
.item.drag{box-shadow:0 8px 20px rgba(0,0,0,.22);position:relative;z-index:5;opacity:.95}
.gh{font-size:13px;font-weight:700;margin:14px 0 6px}
.tabs button .c{opacity:.7;margin-left:4px;font-size:11px}
.dsec{margin-bottom:18px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mh b{font-size:17px}
.mh button{background:var(--card);color:var(--text);border:1px solid var(--line);height:34px;width:40px;padding:0}
.grid{margin-bottom:16px}
.wdrow,.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.week{position:relative;margin-bottom:3px}
.wd{text-align:center;font-size:12px;color:var(--sub);padding:4px 0}
.day{min-height:66px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:4px 2px 2px;font-size:13px;display:flex;flex-direction:column;align-items:stretch;gap:2px;overflow:hidden;text-align:left}
.day.off{opacity:.3}.day.today{border-color:var(--me);font-weight:700}
.day.sel{background:var(--me);color:#fff;border-color:var(--me)}
.dots{display:flex;gap:3px;margin-top:3px;align-items:center;height:10px}
.dot{width:6px;height:6px;border-radius:50%}
.hrt{font-size:10px;line-height:1}
.dn{text-align:center;line-height:1.2}
.chip{display:block;font-size:9px;line-height:1.35;padding:0 3px;border-radius:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid;background:rgba(128,128,128,.14)}
.chip.me{border-color:var(--me)}.chip.you{border-color:var(--you)}.chip.ann{border-color:#f0cf6a;background:rgba(247,220,138,.4)}
.more{font-size:9px;line-height:1.35;color:var(--sub);text-align:center}
.day.sel .chip{background:rgba(255,255,255,.28);color:#fff}.day.sel .more{color:#fff}
.ev .time{font-size:12px;color:var(--sub);min-width:76px}
.memo{font-size:12px;color:var(--sub);margin-top:2px;white-space:pre-wrap}
input[type=time]{flex:none;width:112px}
.ann{background:rgba(247,220,138,.3);border-color:#f3d77e}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.panel{background:var(--bg);width:100%;max-width:480px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.dd{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.dd .n{font-size:19px;font-weight:800;color:var(--me);min-width:78px}
.dd .n.far{color:var(--you)}.dd .d{font-size:11px;color:var(--sub)}
.chk{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.chk input{flex:none;width:18px;height:18px;padding:0;accent-color:var(--me)}
.ghost{background:var(--card);color:var(--sub);border:1px solid var(--line)}

.who{color:#4a4458;font-weight:600}
.item,.dd,.main-tabs{box-shadow:0 2px 12px var(--sh)}
.item,.dd{border-radius:18px}
button{border-radius:14px}
input,select{border-radius:14px}
input:focus,select:focus{outline:2px solid rgba(155,138,224,.35);border-color:var(--me)}
.main-tabs{border-radius:20px;padding:5px}
.main-tabs button{border-radius:15px;font-family:inherit}
.main-tabs button.on{box-shadow:0 3px 10px rgba(155,138,224,.35)}
#tdToggle,#evToggle,#dToggle{background:linear-gradient(135deg,#a897e6,#c9a8ec);box-shadow:0 4px 12px rgba(155,138,224,.28)}
#dBtn,#evBtn,#addBtn{background:linear-gradient(135deg,#a897e6,#c9a8ec)}
h1{font-size:19px;letter-spacing:-.3px}
.day{border-radius:12px;box-shadow:none;min-height:70px}
.dn{width:20px;height:20px;line-height:20px;margin:0 auto;border-radius:50%;font-size:12px}
.day.today{border-color:#f0cf6a;font-weight:700}
.day.today .dn{background:#f9e4a0;color:#5a4a1a}
.day.sel{background:var(--me);color:#fff;border-color:var(--me)}
.tabs button{border-radius:99px}
.tabs button.on{background:var(--me);color:#fff}
.tabs.sm button.on{background:none;color:var(--me)}
button:active{filter:brightness(.97)}

.luck{background:linear-gradient(135deg,#fdf0b8,#fbdbe7);color:#4a3b2a;border-radius:20px;padding:16px;text-align:center;margin-bottom:12px;box-shadow:0 4px 14px var(--sh)}
.luck .big{font-size:20px;font-weight:700;margin:10px 0 12px;word-break:break-all}
.luck button{height:38px;padding:0 14px;font-family:inherit}

.day{min-height:72px;position:relative}
.chip,.more{height:12px;line-height:12px;flex:none}
.chip{padding-top:0;padding-bottom:0}
.chip.ph{visibility:hidden}
.bar{position:absolute;height:12px;line-height:12px;font-size:9px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;color:#4a4458;font-weight:600;z-index:2;box-shadow:0 1px 2px rgba(80,60,120,.12)}
.bdg{position:absolute;top:5px;right:3px;font-size:9px;color:var(--sub)}
.day.sel .bdg{color:#fff}

textarea{width:100%;min-height:96px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font-size:16px;font-family:inherit;resize:vertical;margin-bottom:8px;line-height:1.5}
textarea:focus{outline:2px solid rgba(155,138,224,.35);border-color:var(--me)}
.mk{position:absolute;top:4px;left:3px;font-size:10px;line-height:1;pointer-events:none}

:root{--paper:#fffdf6;--rule:#e8e0f2;--ink:#4d4560}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#312b40;--rule:#403950;--ink:#eee8f7}}
:root[data-theme="dark"]{--paper:#312b40;--rule:#403950;--ink:#eee8f7}
.item.mem{display:block;position:relative;background:var(--paper);color:var(--ink);padding:8px 14px 10px 42px;border-radius:6px 16px 16px 6px;box-shadow:2px 4px 12px var(--sh);margin-bottom:12px;overflow:hidden}
.item.mem::before{content:'';position:absolute;left:34px;top:0;bottom:0;width:2px;background:rgba(243,166,194,.7)}
.item.mem::after{content:'';position:absolute;left:8px;top:10px;bottom:10px;width:16px;background:radial-gradient(circle,var(--bg) 4px,var(--rule) 5px,transparent 6px) 0 0/16px 60px repeat-y}
.mem .mh2{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.mem .mo{font-size:22px;line-height:1}
.mem .del{color:var(--sub)}
.mem .mt{font-family:'Gaegu','Gowun Dodum',cursive;font-size:19px;line-height:28px;white-space:pre-wrap;word-break:break-word;background-image:repeating-linear-gradient(transparent 0,transparent 27px,var(--rule) 27px,var(--rule) 28px)}
#memList .gh{font-family:'Gaegu','Gowun Dodum',cursive;font-size:17px;color:var(--me);margin:16px 0 8px}
#memIn{font-family:'Gaegu','Gowun Dodum',cursive;font-size:19px;line-height:28px;padding:4px 14px;min-height:140px;background-color:var(--paper);background-image:repeating-linear-gradient(transparent 0,transparent 27px,var(--rule) 27px,var(--rule) 28px);background-attachment:local;color:var(--ink)}

.mem .mdate{flex:1;text-align:right;font-family:'Gaegu','Gowun Dodum',cursive;font-size:16px;color:var(--sub);white-space:nowrap}

.hero{margin-bottom:18px}
.pwrap{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:16/10;background:var(--card);box-shadow:0 6px 18px var(--sh)}
.pwrap img{width:100%;height:100%;object-fit:cover;display:block}
.pchg{position:absolute;right:10px;top:10px;height:28px;padding:0 12px;font-size:12px;background:rgba(255,255,255,.85);color:#4a4458;font-family:inherit}
.pempty{width:100%;aspect-ratio:16/10;border:2px dashed #cbbff0;background:linear-gradient(135deg,rgba(229,220,251,.5),rgba(253,240,184,.4));color:var(--sub);border-radius:24px;font-size:15px;line-height:1.9;font-family:inherit}
.hellos{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin-top:12px}
.hrt2{font-size:20px;line-height:1}
.bub{border-radius:18px;padding:8px 12px 10px;text-align:left;min-height:66px;color:#4a4458;box-shadow:0 4px 12px var(--sh);display:block;width:100%;font-family:'Gaegu','Gowun Dodum',cursive;font-size:17px;line-height:1.3;word-break:break-word}
.bub .bn{display:block;font-family:'Gowun Dodum',sans-serif;font-size:11px;font-weight:700;opacity:.65;margin-bottom:3px}
.bub.w{background:#e5dcfb}.bub.g{background:#fbdbe7}
.bub.none{opacity:.8}.bub.none .bt{opacity:.55}

#homeTab{padding-top:8px}
#homeTab .pwrap{aspect-ratio:auto}
#homeTab .pwrap img{height:auto;object-fit:contain}
#homeTab .pempty{aspect-ratio:4/5;max-height:62vh}
#homeTab .hero{margin-bottom:14px}

.chip.ev{color:#4a4458;font-weight:600}
.day.sel .chip.ev{color:#4a4458}
.legend{display:flex;justify-content:center;gap:14px;font-size:11px;color:var(--sub);margin:-8px 0 14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
</style>
</head>
<body>
<main>
  <div class="top" id="topbar"><h1>💕 낑꿍깡꿍 캘린더</h1><div class="hb" id="hb"><button class="dbtn" data-tab="home">🏠</button><button class="dbtn" id="diaryBtn" data-tab="diary">낑꿍일기📝</button><button class="dbtn" id="annBtn" data-tab="ann">💝 기념일</button></div></div>
  <div class="sub" id="status">불러오는 중…</div>
  <div class="main-tabs" id="mainTabs"><button data-tab="cal" class="on">📅 캘린더</button><button data-tab="todo">✅ 투두</button></div>

  <section id="homeTab">
    <div class="hero">
      <div id="heroPh"></div>
      <div class="hellos" id="hellos"></div>
      <div id="helloForm" class="hide" style="margin-top:10px">
        <div class="sub" id="helloWho" style="font-weight:600;color:var(--text);margin:0 0 6px"></div>
        <div class="add" style="margin-bottom:6px"><input id="helloIn" maxlength="60" placeholder="한마디를 남겨보세요 (60자)"><button id="helloBtn" style="height:46px">저장</button><button id="helloCancel" class="ghost" style="height:46px">취소</button></div>
      </div>
      <div id="heroMsg" style="font-size:12px;color:var(--me);min-height:14px;margin-top:4px"></div>
      <input type="file" id="photoIn" accept="image/*" class="hide">
    </div>
    <button id="enterBtn" data-tab="cal" style="height:48px;width:100%;margin-top:6px;background:linear-gradient(135deg,#a897e6,#c9a8ec);box-shadow:0 4px 12px rgba(155,138,224,.28);font-family:inherit">💕 들어가기</button>
  </section>

  <div id="pwOverlay" class="pw-overlay hide" role="dialog" aria-modal="true" aria-labelledby="pwTitle">
    <div class="pw-card">
      <h2 id="pwTitle">🔐 비밀번호를 입력해줘</h2>
      <p>낑꿍깡꿍 캘린더에 들어가려면 비밀번호가 필요해요 💗</p>
      <form id="pwForm">
        <input id="pwInput" type="password" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호" required>
        <div id="pwError" role="alert"></div>
        <div class="pw-actions"><button type="button" id="pwCancel" class="ghost">취소</button><button type="submit">들어가기 💕</button></div>
      </form>
    </div>
  </div>

  <section id="calTab" class="hide">
    <div class="mh"><button data-nav="-1">‹</button><b id="mt"></b><button data-nav="1">›</button></div>
    <div class="grid" id="grid"></div>
    <div class="legend"><span><i style="background:#b3a5ea"></i>낑꿍완댜🤴</span><span><i style="background:#f6b3cb"></i>낑꿍곤듀👸</span><span><i style="background:#f5da86"></i>낑꿍이들💑</span></div>
    <div class="sub" id="selLabel" style="font-weight:600;color:var(--text)"></div>
    <div id="selAnn"></div>
    <button id="evToggle" style="height:44px;width:100%;margin-bottom:10px">＋ 일정 추가</button>
    <div id="evForm" class="hide" style="margin-bottom:10px">
      <input id="evIn" placeholder="일정 제목" maxlength="60" style="width:100%;margin-bottom:8px">
      <div class="add" style="align-items:center"><input id="evStart" type="time" style="flex:1;width:auto"><span style="color:var(--sub)">~</span><input id="evEnd" type="time" style="flex:1;width:auto"></div>
      <div class="add" style="align-items:center"><span style="font-size:12px;color:var(--sub);flex:none">종료일</span><input id="evEndDate" type="date" style="flex:1;width:auto"></div>
      <div style="font-size:11px;color:var(--sub);margin:-4px 0 8px">여러 날 이어지는 일정(여행 등)이면 종료일을 골라요. 비우면 하루짜리예요.</div>
      <div class="tabs" id="whoPick"></div>
      <input id="evMemo" placeholder="내용 (선택)" maxlength="200" style="width:100%;margin-bottom:8px">
      <div class="add"><button id="evBtn" style="height:44px;flex:1">추가</button><button id="evCancel" class="ghost hide" style="height:44px">취소</button></div>
      <div id="evMsg" style="font-size:12px;color:var(--me);min-height:16px"></div>
    </div>
    <div id="evList"></div>
  </section>

  <section id="annTab" class="hide">
<div class="dsec" style="margin-top:4px">
  <div class="sub" style="font-weight:700;color:var(--text);font-size:15px;margin:0 0 8px">💝 우리 기념일</div>
  <div id="dList"></div>
  <button id="dToggle" style="height:44px;width:100%;margin-bottom:10px">＋ 기념일 추가</button>
  <div id="dForm" class="hide" style="margin-bottom:6px"><div id="dFormT" style="font-size:13px;color:var(--me);font-weight:600;margin-bottom:8px">＋ 기념일 추가</div>
  <div class="add"><input id="dIn" placeholder="이름 (예: 사귄 날)" maxlength="30"><input id="dDate" type="date" style="flex:none;width:150px"></div>
  <label class="chk"><input type="checkbox" id="dYear">매년 반복 (생일·주년)</label>
  <label class="chk"><input type="checkbox" id="dMs">100일 단위 자동 계산 (100·200·300일…, 시작일을 1일로 계산)</label>
  <div class="add"><button id="dBtn" style="height:44px;flex:1">추가</button><button id="dCancel" class="ghost hide" style="height:44px">취소</button></div>

<script>
var tasks=[],events=[],anns=[],filter='all',db=null,me=null,names={},col=null,ecol=null,dcol=null,mcol=null,pcol=null,hcol=null,photos=[],hellos=[],helloEdit=null,mems=[],editMem=null,memMood='🥰',memWho='w',tab='home',editEv=null,editAnn=null;
var now=new Date(),cy=now.getFullYear(),cm=now.getMonth();
function ds(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
var sel=ds(cy,cm,now.getDate()),todayS=sel,T0=new Date(cy,cm,now.getDate());
var $=function(id){return document.getElementById(id)};
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

function tag(by){var mine=by===me;return '<span class="who" style="background:var(--'+(mine?'me':'you')+')">'+(mine?'나':esc(names[by]||'상대'))+'</span>'}
var WHO=[['w','낑꿍완댜🤴','#b3a5ea'],['g','낑꿍곤듀👸','#f6b3cb'],['t','낑꿍이들💑','#f5da86']],evWho='t';

function wtag(w){for(var i=0;i<3;i++)if(WHO[i][0]===(w||'t'))return '<span class="who" style="background:'+WHO[i][2]+'">'+WHO[i][1]+'</span>';return ''}
function evOn(d){return events.filter(function(e){return e.date<=d&&d<=(e.endDate||e.date)})}
function md(x){return x.slice(5).replace('-','/')}
function evSort(a,b){return (a.start||a.time||'99').localeCompare(b.start||b.time||'99')}
function evTimeTxt(e){var st=e.start||e.time||'',en=e.end||'';return st&&en?st+'~'+en:st?st+'~':en?'~'+en:'종일'}
function renderWho(){$('whoPick').innerHTML=WHO.map(function(w){var on=evWho===w[0];return '<button data-who="'+w[0]+'" style="'+(on?'background:'+w[2]+';color:#4a4458;border-color:'+w[2]:'')+'">'+w[1]+'</button>'}).join('')}
function setEvForm(o){$('evForm').classList.toggle('hide',!o);$('evToggle').textContent=o?'닫기':'＋ 일정 추가';$('evBtn').textContent=editEv?'수정 완료':'추가';$('evCancel').classList.toggle('hide',!editEv);renderWho()}

function resetMem(){editMem=null;memMood='🥰';$('memDate').value=todayS;$('memIn').value='';$('memMsg').textContent='';setMemForm(false)}
function renderMem(){
  var l=mems.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.at||0)-(a.at||0)}),h='',last='';
  l.forEach(function(m){
    var dt=pd(m.date),dl=m.date.replace(/-/g,'.')+' ('+['일','월','화','수','목','금','토'][dt.getDay()]+')';
    h+='<div class="item mem"><div class="mh2"><span class="mo">'+esc(m.mood||'📖')+'</span>'+(m.who&&m.who!=='t'?wtag(m.who):tag(m.by))+'<span class="mdate">'+dl+'</span><button class="del" data-memedit="'+m.id+'">✎</button><button class="del" data-memdel="'+m.id+'">×</button></div><div class="mt">'+esc(m.text)+'</div></div>';
  });
  $('memList').innerHTML=h||'<div class="empty" style="padding:8px 0 14px">아직 기록이 없어요. 첫 낑꿍일기를 써보세요 📝</div>';
}
function saveMem(){
  var v=$('memIn').value.trim(),d=$('memDate').value;
  if(!d){$('memMsg').textContent='날짜를 선택해주세요';return}
  if(!v){$('memMsg').textContent='내용을 적어주세요';$('memIn').focus();return}
  if(!mcol){$('memMsg').textContent='아직 연결 중이에요. 잠시 후 다시 눌러주세요';return}

function applyTab(){

  $('diaryTab').classList.toggle('hide',tab!=='diary');$('todoTab').classList.toggle('hide',tab!=='todo');$('calTab').classList.toggle('hide',tab!=='cal');$('annTab').classList.toggle('hide',tab!=='ann');
  document.querySelectorAll('.main-tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===tab)});
}
function latest(a){return a.slice().sort(function(x,y){return (y.at||0)-(x.at||0)})[0]}
function curHello(w){return latest(hellos.filter(function(h){return h.who===w}))}
function renderHome(){
  var ph=latest(photos);
  $('heroPh').innerHTML=ph?'<div class="pwrap"><img alt="우리 사진" src="'+ph.data+'"><button class="pchg" data-photo="1">📷 바꾸기</button></div>':'<button class="pempty" data-photo="1">📷<br>우리 사진을 넣어보세요</button>';
  $('hellos').innerHTML=[['w','낑꿍완댜🤴'],['g','낑꿍곤듀👸']].map(function(x){var h=curHello(x[0]);return '<button class="bub '+x[0]+(h?'':' none')+'" data-hello="'+x[0]+'"><span class="bn">'+x[1]+'</span><span class="bt">'+(h?esc(h.text):'탭해서 한마디 남기기 ✍️')+'</span></button>'}).join('<span class="hrt2">💗</span>');
}
function closeHello(){helloEdit=null;$('helloForm').classList.add('hide')}
function saveHello(){
  var w=helloEdit,v=$('helloIn').value.trim(),cur=curHello(w);if(!w)return;
  if(!hcol){$('heroMsg').textContent='아직 연결 중이에요. 잠시 후 다시 눌러주세요';return}
  if(!v){if(cur)guard(hcol.doc(cur.id).delete());closeHello();return}
  if(cur)guard(hcol.doc(cur.id).update({text:v,at:Date.now()}));else guard(hcol.add({who:w,text:v,by:me,at:Date.now()}));
  closeHello();
}
function shrink(f,mx,q,cb){
  var fr=new FileReader();
  fr.onload=function(){var im=new Image();
    im.onload=function(){var r=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',q))};
    im.onerror=function(){cb(null)};im.src=fr.result};
  fr.onerror=function(){cb(null)};fr.readAsDataURL(f);
}
function savePhoto(f){
  if(!f)return;
  if(!pcol){$('heroMsg').textContent='아직 연결 중이에요. 잠시 후 다시 눌러주세요';return}
  $('heroMsg').textContent='사진 올리는 중…';
  shrink(f,900,.75,function(u){
    if(u&&u.length>700000)return shrink(f,640,.6,function(u2){put(u2)});
    put(u);
  });
  function put(u){
    if(!u){$('heroMsg').textContent='사진을 불러오지 못했어요. 다른 사진으로 시도해주세요';return}
    var old=photos.slice();
    guard(pcol.add({data:u,by:me,at:Date.now()}));
    old.forEach(function(p){guard(pcol.doc(p.id).delete())});
    $('heroMsg').textContent='';$('photoIn').value='';
  }
}
function annOn(s){
  var d=pd(s),out=[];
  anns.forEach(function(a){
    var o=pd(a.date),n=dd_(d,o)+1;
    if(s===a.date)out.push(a.title+(a.ms||a.yearly?' 첫날':''));
    else{
      if(a.yearly&&d.getMonth()===o.getMonth()&&d.getDate()===o.getDate()&&d.getFullYear()>o.getFullYear())out.push(a.title+' '+(d.getFullYear()-o.getFullYear())+'주년');
      if(a.ms&&n>0&&n%100===0)out.push(a.title+' '+n+'일');
    }
  });
  return out;
}
function dinfo(a){
  var o=pd(a.date),c=[];
  if(!a.yearly&&!a.ms){var k=dd_(o,T0);return {k:k>=0?k:1e6-k,label:k>0?'D-'+k:k===0?'D-Day 🎉':'D+'+(-k+1),extra:a.date}}
  if(a.yearly){var n=new Date(T0.getFullYear(),o.getMonth(),o.getDate());if(n<T0)n=new Date(T0.getFullYear()+1,o.getMonth(),o.getDate());var y=n.getFullYear()-o.getFullYear();c.push({k:dd_(n,T0),name:y>0?y+'주년':'매년',date:n})}
  var cnt=dd_(T0,o)+1;
  if(a.ms){var m=Math.max(1,Math.ceil(Math.max(cnt,1)/100))*100,md=addDays(o,m-1);c.push({k:dd_(md,T0),name:m+'일',date:md})}
  c.sort(function(x,y){return x.k-y.k});var b=c[0];
  var base=a.ms&&cnt>0?'오늘 D+'+cnt+' · ':'';
  return {k:b.k,label:b.k===0?'D-Day 🎉':'D-'+b.k,extra:base+b.name+' ('+ds(b.date.getFullYear(),b.date.getMonth(),b.date.getDate())+')'}
}
var drag=null;
function tkey(t){return t.ord!=null?t.ord:-(t.at||0)}
function commitOrder(ids){
  var all=tasks.slice().sort(function(a,b){return tkey(a)-tkey(b)}).map(function(t){return t.id}),pos=[];
  all.forEach(function(id,i){if(ids.indexOf(id)>=0)pos.push(i)});
  ids.forEach(function(id,k){all[pos[k]]=id});
  all.forEach(function(id,i){var t=tasks.filter(function(x){return x.id===id})[0];if(t&&t.ord!==i&&col){t.ord=i;guard(col.doc(id).update({ord:i}))}});
}
document.addEventListener('pointerdown',function(e){
  var g=e.target.closest&&e.target.closest('.grip');if(!g)return;
  var it=g.closest('.note');if(!it)return;e.preventDefault();
  drag={it:it,grp:it.parentNode};it.classList.add('drag');
  try{g.setPointerCapture(e.pointerId)}catch(x){}
});
document.addEventListener('pointermove',function(e){
  if(!drag)return;var it=drag.it;
  var el=document.elementFromPoint(e.clientX,e.clientY),over=el&&el.closest&&el.closest('.note');
  if(over&&over!==it&&over.parentNode===drag.grp){
    var k=[].slice.call(drag.grp.children);
    if(k.indexOf(it)<k.indexOf(over))drag.grp.insertBefore(it,over.nextSibling);else drag.grp.insertBefore(it,over);
  }
  if(e.clientY<90)window.scrollBy(0,-12);else if(e.clientY>innerHeight-90)window.scrollBy(0,12);
});
function endDrag(){
  if(!drag)return;var it=drag.it,grp=drag.grp;it.classList.remove('drag');
  var ids=[].slice.call(grp.querySelectorAll('.note')).map(function(x){return x.dataset.tid});
  drag=null;commitOrder(ids);renderTodo();
}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
var CATS=[['do','🎯 하고싶은 것'],['eat','🍽️ 먹고싶은 것']],cat='all';
function tc(t){return t.cat||'do'}
function hs(id){var h=0;id=String(id);for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))|0;return Math.abs(h)}
function taskHtml(t){var h=hs(t.id);return '<div class="note c'+(h%5)+(t.done?' done':'')+'" data-tid="'+t.id+'" style="--rot:'+((((h>>3)%5)-2)*0.6)+'deg"><div class="nt"><input type="checkbox" data-id="'+t.id+'" '+(t.done?'checked':'')+'><span class="grip">⠿</span></div><div class="ntx">'+esc(t.text)+'</div><div class="nb">'+tag(t.by)+'<button class="del" data-del="'+t.id+'">×</button></div></div>'}
function renderTodo(){
  if(drag)return;
  var ct=[['all','전체']].concat(CATS);
  $('catTabs').innerHTML=ct.map(function(c){var n=tasks.filter(function(t){return !t.done&&(c[0]==='all'||tc(t)===c[0])}).length;return '<button data-cat="'+c[0]+'" class="'+(cat===c[0]?'on':'')+'">'+c[1]+'<span class="c">'+n+'</span></button>'}).join('');
  var tabs=[['all','전체'],['open','투두!✨'],['done','완료💕']];
  $('tabs').innerHTML=tabs.map(function(t){return '<button data-f="'+t[0]+'" class="'+(filter===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('');
  var l=tasks.slice().sort(function(a,b){return tkey(a)-tkey(b)}).filter(function(t){return (filter==='all'||(filter==='done')===!!t.done)&&(cat==='all'||tc(t)===cat)});
  var h='';
  if(cat==='all'){CATS.forEach(function(c){var g=l.filter(function(t){return tc(t)===c[0]});if(g.length)h+='<div class="gh">'+c[1]+'</div><div class="grp">'+g.map(taskHtml).join('')+'</div>'})}
  else h=l.length?'<div class="grp">'+l.map(taskHtml).join('')+'</div>':'';
  if(h)h='<div class="sub" style="margin:4px 0 0;font-size:12px">⠿ 을 잡고 끌어서 우선순위를 바꿔요 (앞쪽일수록 중요!)</div>'+h;
  $('list').innerHTML=h||'<div class="empty">아직 없어요 ✨ 위에서 추가해보세요</div>';
}
function renderCal(){
  $('mt').textContent=cy+'년 '+(cm+1)+'월';
  var h='<div class="wdrow">'+['일','월','화','수','목','금','토'].map(function(w){return '<div class="wd">'+w+'</div>'}).join('')+'</div>';
  var first=new Date(cy,cm,1).getDay(),st0=new Date(cy,cm,1-first);
  for(var w=0;w<6;w++){
    var ws=addDays(st0,w*7),wsS=ds(ws.getFullYear(),ws.getMonth(),ws.getDate()),we=addDays(ws,6),weS=ds(we.getFullYear(),we.getMonth(),we.getDate());
    var multi=events.filter(function(e){return e.endDate&&e.endDate>e.date&&e.endDate>=wsS&&e.date<=weS}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(dd_(pd(b.endDate),pd(b.date))-dd_(pd(a.endDate),pd(a.date)))});
    var occ=[],bars='',hid=[0,0,0,0,0,0,0];
    multi.forEach(function(e){
      var c0=Math.max(0,dd_(pd(e.date),ws)),c1=Math.min(6,dd_(pd(e.endDate),ws)),L=0,c;
      for(;;L++){occ[L]=occ[L]||[];var ok=true;for(c=c0;c<=c1;c++)if(occ[L][c])ok=false;if(ok)break}
      for(c=c0;c<=c1;c++)occ[L][c]=true;
      if(L>=3){for(c=c0;c<=c1;c++)hid[c]++;return}
      var sH=e.date>=wsS,eH=e.endDate<=weS,n=c1-c0+1,li=sH?3:0,ri=eH?3:0;
      bars+='<span class="bar" style="left:calc((100% - 18px)/7*'+c0+' + '+(3*c0+li)+'px);width:calc((100% - 18px)/7*'+n+' + '+(3*(n-1)-li-ri)+'px);top:'+(27+L*14)+'px;background:'+wcol(e.who)+';border-radius:'+(sH?6:0)+'px '+(eH?6:0)+'px '+(eH?6:0)+'px '+(sH?6:0)+'px">'+(sH?'':'◀ ')+esc(e.title)+'</span>';
    });
    var cells='';
    for(var c=0;c<7;c++){
      var dt=addDays(ws,c),s=ds(dt.getFullYear(),dt.getMonth(),dt.getDate()),slot=[null,null,null],L;
      for(L=0;L<3;L++)if(occ[L]&&occ[L][c])slot[L]='ph';
      var q=annOn(s).map(function(t){return {t:'💝'+t,c:'ann'}}).concat(events.filter(function(e){return e.date===s&&!(e.endDate&&e.endDate>e.date)}).sort(evSort).map(function(e){return {t:e.title,c:'ev',col:wcol(e.who)}}));
      for(L=0;L<3;L++)if(!slot[L]&&q.length)slot[L]=q.shift();
      var over=q.length+hid[c],badge='';
      if(over>0){
        if(slot[2]==='ph')badge='<span class="bdg">+'+over+'</span>';
        else{if(slot[2])over++;slot[2]={more:over}}
      }
      var last=-1;for(L=0;L<3;L++)if(slot[L])last=L;
      var chips='';
      for(L=0;L<=last;L++){var it=slot[L];
        if(!it||it==='ph')chips+='<span class="chip ph"></span>';
        else if(it.more)chips+='<span class="more">+'+it.more+'개 더</span>';
        else chips+='<span class="chip '+it.c+'"'+(it.col?' style="background:'+it.col+';border-color:'+it.col+'"':'')+'>'+esc(it.t)+'</span>';
      }
      cells+='<button class="day'+(dt.getMonth()!==cm?' off':'')+(s===todayS?' today':'')+(s===sel?' sel':'')+'" data-day="'+s+'"><span class="dn">'+dt.getDate()+'</span>'+(memOn(s).length?'<span class="mk">'+esc(memOn(s)[0].mood||'📖')+'</span>':'')+badge+chips+'</button>';
    }
    h+='<div class="week">'+cells+bars+'</div>';
  }
  $('grid').innerHTML=h;
  var p=sel.split('-');
  $('selLabel').textContent=(+p[1])+'월 '+(+p[2])+'일 일정';
  $('selAnn').innerHTML=annOn(sel).map(function(t){return '<div class="item ann"><span>💝</span><span class="t">'+esc(t)+'</span></div>'}).join('');
  var l=evOn(sel).sort(evSort);
  $('evList').innerHTML=l.length?l.map(function(e){
    return '<div class="item ev"><span class="time">'+evTimeTxt(e)+'</span><div class="t"><div>'+esc(e.title)+'</div>'+(e.endDate&&e.endDate>e.date?'<div class="memo">📆 '+md(e.date)+' ~ '+md(e.endDate)+' ('+(dd_(pd(sel),pd(e.date))+1)+'/'+(dd_(pd(e.endDate),pd(e.date))+1)+'일차)</div>':'')+(e.memo?'<div class="memo">'+esc(e.memo)+'</div>':'')+'</div>'+wtag(e.who)+'<button class="del" data-evedit="'+e.id+'">✎</button><button class="del" data-evdel="'+e.id+'">×</button></div>'
  }).join(''):(annOn(sel).length?'':'<div class="empty">이 날은 일정이 없어요</div>');
  renderMem();
}
function renderD(){
  var l=anns.map(function(a){return {a:a,i:dinfo(a)}}).sort(function(x,y){return x.i.k-y.i.k});
  $('dList').innerHTML=l.length?l.map(function(x){var a=x.a;return '<div class="dd"><span class="n'+(x.i.k>30?' far':'')+'">'+x.i.label+'</span><div style="flex:1;min-width:0"><div class="t">'+esc(a.title)+'</div><div class="d">'+x.i.extra+'</div></div>'+tag(a.by)+'<button class="del" data-annedit="'+a.id+'">✎</button><button class="del" data-anndel="'+a.id+'">×</button></div>'}).join(''):'<div class="empty" style="padding:8px 0">첫 기념일을 등록해보세요 💕</div>';
  $('dBtn').textContent=editAnn?'수정 완료':'추가';$('dCancel').classList.toggle('hide',!editAnn);
  $('dFormT').textContent=editAnn?'✎ 기념일 수정':'＋ 기념일 추가';
}
function render(){
  var open=tasks.filter(function(t){return !t.done}).length;
  if(db)$('status').textContent=(db.local?'🧪 테스트 모드 (연결 꺼짐 · 새로고침하면 사라져요)':'실시간 공유 중')+' · 남은 할 일 '+open+'개 · 일정 '+events.length+'개 · 기념일 '+anns.length+'개';
  renderHome();renderTodo();renderCal();renderD();
}
async function guard(p){try{await p}catch(e){var m='저장 실패'+(e&&e.code?' ('+e.code+')':'')+' · 공유 설정에서 연인을 편집 가능으로 초대했는지 확인하세요.';$('status').textContent=m;$('dMsg').textContent=m;if(tab==='home')$('heroMsg').textContent=m}}
var luckTimer=null;
function luck(){
  var pool=tasks.filter(function(t){return !t.done&&tc(t)==='do'}),box=$('luck');
  clearInterval(luckTimer);box.classList.remove('hide');
  if(!pool.length){box.innerHTML='<div class="big">아직 하고싶은 것이 없어요 🥲</div><div style="font-size:12px;margin-bottom:10px">🎯 하고싶은 것을 먼저 추가해보세요</div><button data-luckx="1">닫기</button>';return}
  box.innerHTML='<div>🎲 두근두근 뽑는 중…</div><div class="big" id="luckT">&nbsp;</div>';
  var n=0;
  luckTimer=setInterval(function(){
    var pk=pool[Math.floor(Math.random()*pool.length)];n++;
    if(n<14){$('luckT').textContent=pk.text;return}
    clearInterval(luckTimer);
    box.innerHTML='<div>🎉 오늘은 이거 해보자!</div><div class="big">'+esc(pk.text)+'</div><div style="display:flex;gap:8px;justify-content:center"><button data-luck="1" class="ghost">🎲 다시 뽑기</button><button data-luckx="1">닫기</button></div>';
  },90);
}
function setTdForm(o){$('tdForm').classList.toggle('hide',!o);$('tdToggle').textContent=o?'닫기':'＋ 투두 추가'}
function add(){var v=$('in').value.trim();if(!v||!col)return;$('in').value='';guard(col.add({text:v,done:false,cat:$('catSel').value,by:me,at:Date.now()}));setTdForm(false)}
function addEv(){
  var v=$('evIn').value.trim(),st=$('evStart').value,en=$('evEnd').value;
  if(!v){$('evMsg').textContent='일정 제목을 입력해주세요';$('evIn').focus();return}
  if(st&&en&&en<st){$('evMsg').textContent='끝나는 시간이 시작 시간보다 빨라요';return}
  if(!ecol){$('evMsg').textContent='아직 연결 중이에요. 잠시 후 다시 눌러주세요';return}
  var sd=editEv?((events.filter(function(x){return x.id===editEv})[0]||{}).date||sel):sel,ed=$('evEndDate').value;
  if(ed&&ed<sd){$('evMsg').textContent='종료일이 시작일('+md(sd)+')보다 빨라요';return}
  var data={title:v,start:st,end:en,endDate:ed&&ed>sd?ed:'',memo:$('evMemo').value.trim(),who:evWho};
  if(editEv)guard(ecol.doc(editEv).update(data));
  else{data.date=sel;data.by=me;data.at=Date.now();guard(ecol.add(data))}
  resetEv();
}
function setForm(o){$('dForm').classList.toggle('hide',!o);$('dToggle').textContent=o?'닫기':'＋ 기념일 추가'}
function resetD(){setForm(false);editAnn=null;$('dMsg').textContent='';$('dIn').value='';$('dDate').value=todayS;$('dYear').checked=false;$('dMs').checked=false;renderD()}
function saveD(){
  var v=$('dIn').value.trim(),d=$('dDate').value;
  if(!v){$('dMsg').textContent='기념일 이름을 입력해주세요';$('dIn').focus();return}
  if(!d){$('dMsg').textContent='날짜를 선택해주세요';return}
  if(!dcol){$('dMsg').textContent='아직 연결 중이에요. 잠시 후 다시 눌러주세요';return}
  $('dMsg').textContent='';
  var data={title:v,date:d,yearly:$('dYear').checked,ms:$('dMs').checked};
  if(editAnn)guard(dcol.doc(editAnn).update(data));else{data.by=me;data.at=Date.now();guard(dcol.add(data))}
  resetD();
}
document.addEventListener('click',function(e){
  var el=e.target.closest('button');if(!el)return;var d=el.dataset;
  if(el.id==='enterBtn'){e.preventDefault();$('pwInput').value='';$('pwError').textContent='';$('pwOverlay').classList.remove('hide');setTimeout(function(){$('pwInput').focus()},0);return}
  if(el.id==='pwCancel'){$('pwOverlay').classList.add('hide');return}
  if(d.tab){tab=((d.tab==='ann'||d.tab==='diary')&&d.tab===tab)?'cal':d.tab;applyTab();if(window.scrollTo)window.scrollTo(0,0)}
  if(d.f){filter=d.f;renderTodo()}
  if(d.luck)luck();
  if(d.luckx){clearInterval(luckTimer);$('luck').classList.add('hide')}
  if(d.cat){cat=d.cat;if(cat!=='all')$('catSel').value=cat;renderTodo()}
  if(d.del&&col)guard(col.doc(d.del).delete());
  if(d.evdel&&ecol){if(editEv===d.evdel)resetEv();guard(ecol.doc(d.evdel).delete())}
  if(d.evedit){var ev=events.filter(function(x){return x.id===d.evedit})[0];if(ev){editEv=ev.id;$('evIn').value=ev.title;$('evStart').value=ev.start||ev.time||'';$('evEnd').value=ev.end||'';$('evMemo').value=ev.memo||'';$('evEndDate').value=ev.endDate||'';evWho=ev.who||'t';setEvForm(true);$('evIn').focus()}}
  if(d.who){evWho=d.who;renderWho()}
  if(d.photo)$('photoIn').click();
  if(d.hello){helloEdit=d.hello;var ch=curHello(d.hello);$('helloIn').value=ch?ch.text:'';$('helloWho').textContent=(d.hello==='w'?'낑꿍완댜🤴':'낑꿍곤듀👸')+'의 한마디';$('helloForm').classList.remove('hide');$('helloIn').focus()}
  if(d.mood){memMood=d.mood;renderMood()}
  if(d.memwho){memWho=d.memwho;renderMemWho()}
  if(d.memdel&&mcol){if(editMem===d.memdel)resetMem();guard(mcol.doc(d.memdel).delete())}
  if(d.memedit){var mm=mems.filter(function(x){return x.id===d.memedit})[0];if(mm){editMem=mm.id;memMood=mm.mood||'🥰';if(mm.who&&mm.who!=='t')memWho=mm.who;$('memDate').value=mm.date;$('memIn').value=mm.text;setMemForm(true);$('memIn').focus()}}
  if(d.anndel&&dcol){if(editAnn===d.anndel)resetD();guard(dcol.doc(d.anndel).delete())}
  if(d.annedit){var a=anns.filter(function(x){return x.id===d.annedit})[0];if(a){editAnn=a.id;$('dIn').value=a.title;$('dDate').value=a.date;$('dYear').checked=!!a.yearly;$('dMs').checked=!!a.ms;renderD();setForm(true);$('dIn').focus()}}
  if(d.nav){cm+=+d.nav;if(cm<0){cm=11;cy--}if(cm>11){cm=0;cy++}renderCal()}
  if(d.day){sel=d.day;var p=sel.split('-');cy=+p[0];cm=+p[1]-1;renderCal()}
});
document.addEventListener('change',function(e){var id=e.target.dataset.id;if(id&&col)guard(col.doc(id).update({done:e.target.checked}))});
$('dToggle').onclick=function(){if($('dForm').classList.contains('hide')){setForm(true);$('dIn').focus()}else resetD()};$('dBtn').onclick=saveD;$('dDate').value=todayS;$('dCancel').onclick=resetD;
$('tdToggle').onclick=function(){if($('tdForm').classList.contains('hide')){setTdForm(true);$('in').focus()}else setTdForm(false)};$('addBtn').onclick=add;$('evBtn').onclick=addEv;$('evCancel').onclick=resetEv;$('memDate').value=todayS;$('photoIn').onchange=function(){savePhoto(this.files&&this.files[0])};$('helloBtn').onclick=saveHello;$('helloCancel').onclick=closeHello;$('helloIn').onkeydown=function(e){if(e.key==='Enter')saveHello()};$('memBtn').onclick=saveMem;$('memCancel').onclick=resetMem;$('memToggle').onclick=function(){if($('memForm').classList.contains('hide')){setMemForm(true);$('memIn').focus()}else resetMem()};$('evToggle').onclick=function(){if($('evForm').classList.contains('hide')){setEvForm(true);$('evIn').focus()}else resetEv()};renderWho();
$('in').onkeydown=function(e){if(e.key==='Enter')add()};
$('evIn').onkeydown=function(e){if(e.key==='Enter')addEv()};
$('pwForm').addEventListener('submit',function(e){e.preventDefault();if($('pwInput').value==='260510'){$('pwOverlay').classList.add('hide');tab='cal';applyTab();if(window.scrollTo)window.scrollTo(0,0)}else{$('pwError').textContent='비밀번호가 맞지 않아요. 다시 입력해줘!';$('pwInput').select()}});
$('pwOverlay').addEventListener('click',function(e){if(e.target===$('pwOverlay'))$('pwOverlay').classList.add('hide')});
applyTab();render();
var USE_DB=false; // 서버 연결은 일단 꺼둠 (true로 바꾸면 연인과 실시간 공유)
function lc(arr){return{
  add:async function(d){var x={};for(var k in d)x[k]=d[k];x.id='l'+Date.now()+Math.floor(Math.random()*1e4);arr.unshift(x);render()},
  doc:function(id){return{
    update:async function(d){var x=arr.filter(function(i){return i.id===id})[0];if(x)for(var k in d)x[k]=d[k];render()},
    delete:async function(){for(var i=0;i<arr.length;i++)if(arr[i].id===id){arr.splice(i,1);break}render()}}}
}}
(async function(){
  if(!USE_DB){db={local:true};me='me';col=lc(tasks);ecol=lc(events);dcol=lc(anns);mcol=lc(mems);pcol=lc(photos);hcol=lc(hellos);render();return}
  try{
    db=await claude.use('db');var user=await claude.use('user');
    if(!db||!user){$('status').textContent='로그인 후 이용할 수 있어요';return}
    me=await user.id();col=db.collection('tasks');ecol=db.collection('events');dcol=db.collection('anniversaries');mcol=db.collection('memories');pcol=db.collection('photos');hcol=db.collection('hellos');
    async function names_(){
      var ids=[];tasks.concat(events,anns,mems).forEach(function(t){if(t.by&&ids.indexOf(t.by)<0)ids.push(t.by)});
      try{var p=await user.profiles(ids);ids.forEach(function(i){names[i]=p[i]&&p[i].name||''})}catch(e){}
      render();
    }
    var mk=function(fn){return function(s){fn(s.docs.map(function(d){var x=d.data();x.id=d.id;return x}));names_()}};
    function sub(label,q,set,n){
      q.onSnapshot(mk(set),function(e){
        $('status').textContent='연결 실패 ('+label+': '+(e&&e.code||'unknown')+') · 다시 시도 중…';
        if(n<5)setTimeout(function(){sub(label,q,set,n+1)},3000*(n+1));
      });
    }
    sub('투두',col.orderBy('at','desc'),function(a){tasks=a},0);
    sub('일정',ecol.orderBy('date'),function(a){events=a},0);
    sub('기념일',dcol,function(a){anns=a},0);
    sub('기록',mcol.orderBy('at','desc'),function(a){mems=a},0);
    sub('사진',pcol.orderBy('at','desc'),function(a){photos=a},0);
    sub('한마디',hcol.orderBy('at','desc'),function(a){hellos=a},0);
  }catch(e){$('status').textContent='연결 실패 (설정: '+(e&&(e.code||e.message)||'unknown')+')'}
})();
</script>
